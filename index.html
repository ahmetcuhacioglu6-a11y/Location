<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMCET 2027</title>
<style>
  :root{--red:#e22a2a;--navy:#123a6b;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       background:#f4f4f5;color:#18181b;display:flex;min-height:100vh;
       align-items:center;justify-content:center;padding:24px;}
  .card{background:#fff;border-radius:22px;padding:36px 24px;max-width:380px;width:100%;
        box-shadow:0 12px 44px rgba(0,0,0,.10);text-align:center;}
  .pin{width:58px;height:58px;margin:0 auto 14px;}
  h1{font-size:24px;margin:0 0 6px;letter-spacing:.5px;}
  h2{font-size:20px;margin:0 0 4px;}
  .sub{margin:0 0 26px;color:#71717a;font-size:14px;}
  a.btn,button.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
        border:none;cursor:pointer;text-decoration:none;font-weight:600;font-size:16px;
        padding:16px;border-radius:14px;margin-bottom:12px;transition:transform .05s;
        font-family:inherit;}
  a.btn:active,button.btn:active{transform:scale(.98);}
  .primary{background:var(--navy);color:#fff;}
  .secondary{background:#eef1f6;color:var(--navy);}
  .apple{background:#000;color:#fff;}
  .google{background:var(--red);color:#fff;}
  .yandex{background:#ffcc00;color:#18181b;}
  .back{background:none;color:#71717a;font-size:14px;margin-top:6px;padding:8px;}
  svg.ic{width:20px;height:20px;}
  .hidden{display:none;}
</style>
</head>
<body>
  <div class="card">

    <!-- GIRIS EKRANI -->
    <div id="welcome">
      <svg class="pin" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 6C34 6 22 18 22 34 22 54 50 90 50 90S78 54 78 34C78 18 66 6 50 6Z" fill="#123a6b"/>
        <circle cx="50" cy="33" r="11" fill="#fff"/>
      </svg>
      <h1>WELCOME TO IMCET 2027!</h1>
      <p class="sub">Please choose an option</p>

      <a class="btn primary" href="https://imcet.org.tr/">Official Website of IMCET 2027</a>
      <button class="btn secondary" onclick="showLocation()">Location of Congress</button>
    </div>

    <!-- KONUM EKRANI -->
    <div id="location" class="hidden">
      <svg class="pin" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 6C34 6 22 18 22 34 22 54 50 90 50 90S78 54 78 34C78 18 66 6 50 6Z" fill="#e22a2a"/>
        <circle cx="50" cy="33" r="11" fill="#fff"/>
      </svg>
      <h2>Granada Luxury Belek</h2>
      <p class="sub">Open the map in</p>

      <a class="btn apple" href="https://maps.apple/p/2fh-QHpjYBKnkF">
        <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        Apple Maps
      </a>
      <a class="btn google" href="https://maps.app.goo.gl/MqAzRPSoCR4v4DeS9">
        <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        Google Maps
      </a>
      <a class="btn yandex" href="https://yandex.com.tr/maps/-/CThnMXOG">
        <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
        Yandex Maps
      </a>
      <button class="btn back" onclick="showWelcome()">← Back</button>
    </div>

  </div>

<script>
  function showLocation(){
    document.getElementById('welcome').classList.add('hidden');
    document.getElementById('location').classList.remove('hidden');
  }
  function showWelcome(){
    document.getElementById('location').classList.add('hidden');
    document.getElementById('welcome').classList.remove('hidden');
  }
</script>
</body>
</html>
